<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pack Out">
  <!--
    An A-frame under a tarp: one solid shape, because a favicon is read at 16px
    in a tab strip and anything finer than one shape turns to mush there. The
    earlier mark paired a ridge line with a grommet ring and the two collapsed
    into a blob — this was chosen by rendering the candidates at 16px and
    looking, not by judging them at 512.

    The base is splayed wider than a plain triangle and the door notch cuts up
    into it, so at larger sizes it reads as a shelter rather than a letter A.
  -->
  <rect width="512" height="512" rx="112" fill="#0f1115"/>
  <path
    d="M256 86 60 412h150l46-104 46 104h150Z"
    fill="#f2c200"
    stroke="#f2c200"
    stroke-width="8"
    stroke-linejoin="round"
  />
</svg>
